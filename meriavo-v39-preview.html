.buy-now:hover{background:#056FE9!important}
.secondary-buy:disabled,.buy-now:disabled{opacity:.48;cursor:not-allowed;box-shadow:none!important}

  .search-result .thumbbox{
    width:56px;height:56px;
  }
}

/* ---------- TOUCH + REDUCED MOTION ---------- */
@media(hover:none),(pointer:coarse){
  .btn:hover,
  .iconbtn:hover,
  .cart-pill:hover,
  .close:hover,
  .thumb:hover,
  .swatch:hover,
  .search-result:hover{
    transform:none;
  }
  .main-image .device{
    transform:scale(1.36)!important;
    transform-origin:50% 50%!important;
  }
}

@media(prefers-reduced-motion:reduce){
  .btn,.iconbtn,.cart-pill,.close,.thumb,.swatch,.search-result,
  .main-image .device{
    transition:none!important;
  }
  .search-panel{transform:none!important}
}



/* =====================================================================
   MERIAVO V7 — DEEP APPLE-LIKE DESIGN PASS
   Product-first. Strong type. Precise spacing. Quiet, useful interaction.
   ===================================================================== */

:root{
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-6:24px;
  --space-8:32px;
  --space-10:40px;
  --space-12:48px;
  --space-16:64px;
  --space-20:80px;
  --space-24:96px;

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
  --radius-xl:30px;

  --shadow-sm:0 3px 12px rgba(17,19,23,.055);
  --shadow-md:0 14px 36px rgba(17,19,23,.085);
  --shadow-product:0 20px 56px rgba(17,19,23,.12);
  --shadow-overlay:0 30px 90px rgba(17,19,23,.22);

  --ease-apple:cubic-bezier(.22,.61,.36,1);
  --header-live:76px;
}

/* ---------- GLOBAL TYPE / RHYTHM ---------- */

  max-width:520px;
}
.section-label,.kicker,.eyebrow{

}

/* ---------- HEADER: QUIET AT TOP, MORE COMPACT AFTER SCROLL ---------- */

  height:var(--header-live)!important;
  background:rgba(255,255,255,.985)!important;
  border-bottom:1px solid rgba(229,234,240,.92)!important;

    height 220ms var(--ease-apple),

    box-shadow 220ms ease,

.nav a{

  padding-block:0!important;

  align-items:center;

}

/* ---------- HERO: PRODUCT IS THE STAR ---------- */

/* =====================================================================
   MERIAVO V10 — precision fixes from live review
   ===================================================================== */

/* 1. Carousel arrows: mathematically centered on the visible card,
   excluding the track's bottom breathing-space. */
.featured-arrow{
  top:calc(50% - 7px)!important;
}

/* 2. Quick-add: never morphs into a check. Keep the + and animate the control. */
.quick-add.is-added,
.quick-add.is-adding{
  background:var(--blue)!important;
  color:#fff!important;
  border-color:transparent!important;
  box-shadow:0 7px 18px rgba(17,124,255,.20)!important;
}
.quick-add.is-adding{
  animation:meriavoQuickAdd 420ms cubic-bezier(.22,.61,.36,1);
}
@keyframes meriavoQuickAdd{
  0%{transform:scale(1)}
  35%{transform:scale(.88)}
  68%{transform:scale(1.09)}
  100%{transform:scale(1)}
}
.quick-add.is-adding::after{
  content:"";
  position:absolute;
  inset:-5px;
  border:1px solid rgba(17,124,255,.34);
  border-radius:50%;
  animation:meriavoQuickRing 420ms ease-out forwards;
  pointer-events:none;
}
@keyframes meriavoQuickRing{
  from{opacity:.7;transform:scale(.78)}
  to{opacity:0;transform:scale(1.25)}
}

/* 3. FAQ/product accordions: one proper + that rotates smoothly into ×.
   Text glyph changes from older scripts are deliberately hidden. */
.faq-q span,
.acc>button span{
  position:relative!important;
  width:22px!important;
  height:22px!important;
  flex:0 0 22px!important;
  display:block!important;
  font-size:0!important;
  line-height:0!important;
  color:transparent!important;
  transform:rotate(0deg);
  transition:transform 180ms cubic-bezier(.22,.61,.36,1)!important;
}
.faq-q span::before,
.faq-q span::after,
.acc>button span::before,
.acc>button span::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:14px;
  height:2px;
  border-radius:999px;
  background:var(--blue);
  transform:translate(-50%,-50%);
}
.faq-q span::after,
.acc>button span::after{
  transform:translate(-50%,-50%) rotate(90deg);
}
.faq-item.open .faq-q span,
.acc.open>button span{
  transform:rotate(45deg)!important;
}

/* 4. Product inspection: old origin vars are ignored.
   V10 uses a faster, smooth cursor-following focal system. */
.main-image{
  --v10-scale:1.36;
  --v10-ox:50%;
  --v10-oy:50%;
}
.main-image .device,
.main-image:hover .device{
  transform:scale(var(--v10-scale))!important;
  transform-origin:var(--v10-ox) var(--v10-oy)!important;
  transition:none!important;
  will-change:transform,transform-origin;
  backface-visibility:hidden;
}

.btn.is-added{
  border-radius:999px!important;
  background:#fff!important;
  color:var(--blue)!important;
  border:1px solid #B8D6FA!important;
  box-shadow:0 0 0 4px rgba(17,124,255,.07),0 7px 18px rgba(17,19,23,.07)!important;

  position:fixed;
  inset:0;
  z-index:260;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(12,15,19,.32);

  visibility:hidden;
  pointer-events:none;

}
.delete-confirm.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
